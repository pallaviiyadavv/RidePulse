<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Demand Predictor</title>
    <style>
        :root {
            --bg: #f7f6f3;
            --card: #ffffff;
            --border: #e3e0da;
            --text: #2b2b2b;
            --muted: #6b6b6b;
            --accent: #3d3d3d;
            --accent-dark: #222222;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 480px;
            margin: 48px auto;
            padding: 0 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .card-header {
            background: #f0eeea;
            color: var(--text);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
        }

        .card-header h4 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
        }

        .card-body {
            padding: 24px;
        }

        .mb-3 {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        select,
        input {
            display: block;
            width: 100%;
            padding: 9px 11px;
            font: inherit;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        input::placeholder {
            color: #9aa3ae;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
        }

        .btn {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 11px;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn:hover {
            background: var(--accent-dark);
        }

        .btn:focus-visible {
            outline: 3px solid rgba(0, 0, 0, 0.2);
            outline-offset: 2px;
        }

        @media (max-width: 480px) {
            .container {
                margin: 20px auto;
            }

            .card-body {
                padding: 18px;
            }
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0 text-center">🚗 Ride Demand Predictor</h4>
                    </div>
                    <div class="card-body p-4">
                        <form action="/predict" method="POST">
                            
                            <div class="mb-3">
                                <label class="form-label">Start Location:</label>
                                <select name="start" required>

                                    <option value="">Select a location</option>

                                    {% for location in locations %}
                                        <option value="{{ location }}">
                                            {{ location }}
                                        </option>
                                    {% endfor %}

                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Hour of Day (0-23):</label>
                                    <input
                                        type="time"
                                        name="time"
                                        required
                                    >
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Day of Week (0=Monday, 6=Sunday):</label>
                                <input type="number" name="day_of_week" min="0" max="6" class="form-control" placeholder="e.g. 4" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Category:</label>
                                <select name="category" class="form-select" required>
                                    <option value="Business">Business</option>
                                    <option value="Personal">Personal</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mt-3">Predict Demand Tier</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
