<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>RidePulse Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #e5e5e5;
        }

        .card p {
            color: #666;
            margin-bottom: 10px;
        }

        .card h2 {
            font-size: 30px;
        }

        .section {
            margin-top: 30px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #e5e5e5;
        }

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <div class="header">

            <h1>🚕 RidePulse</h1>

            <p>
                Ride Analytics Dashboard
            </p>

        </div>


        <!-- KPI CARDS -->

        <div class="cards">

            <div class="card">

                <p>🚗 Total Rides</p>

                <h2>{{ total_rides }}</h2>

            </div>


            <div class="card">

                <p>📍 Locations</p>

                <h2>{{ total_locations }}</h2>

            </div>


            <div class="card">

                <p>🛣️ Average Miles</p>

                <h2>{{ avg_miles }}</h2>

            </div>


            <div class="card">

                <p>⏱️ Average Duration</p>

                <h2>{{ avg_duration }} min</h2>

            </div>

        </div>


        <!-- CHARTS WILL COME HERE -->

        <div class="section">

            <h2>📊 Hourly Reide Demand</h2>

            <p style="margin-top: 10px; color: #666;">
                <canvas id="hourlyChart"></canvas>
            </p>

        </div>
        <div class="section">
            <h2>📅 Demand by Day</h2>

            <canvas id="dayChart"></canvas>

        </div>
        <div class="section">
   
            <h2>Top 10 Start Locations</h2>

            <canvas id="locationChart"></canvas>

                
        </div>


    </div>
    <script>
    const hours = JSON.parse('{{ hours | tojson }}');
    const rideCounts = JSON.parse('{{ ride_counts | tojson }}');

    const ctx = document.getElementById("hourlyChart");

    new Chart(ctx, {
        type: "line",

        data: {
            labels: hours,

            datasets: [{
                label: "Number of Rides",
                data: rideCounts,
                tension: 0.3
            }]
        },

        options: {
            responsive: true,

            scales: {
                x: {
                    title: {
                        display: true,
                        text: "Hour of Day"
                    }
                },

                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: "Number of Rides"
                    }
                }
            }
        }
    });
</script>
<script id="day-data" type="application/json">
    {
        "days": {{ days | tojson }},
        "counts": {{ day_counts | tojson }}
    }
</script>

<script>
    const dayData = JSON.parse(
        document.getElementById("day-data").textContent
    );

    const dayCtx = document.getElementById("dayChart");

    new Chart(dayCtx, {
        type: "bar",

        data: {
            labels: dayData.days,

            datasets: [{
                label: "Number of Rides",
                data: dayData.counts
            }]
        },

        options: {
            responsive: true,

            scales: {
                y: {
                    beginAtZero: true,

                    title: {
                        display: true,
                        text: "Number of Rides"
                    }
                },

                x: {
                    title: {
                        display: true,
                        text: "Day of Week"
                    }
                }
            }
        }
    });
</script>
<script id="location-data" type="application/json">
{
    "locations": {{ top_locations | tojson }},
    "counts": {{ location_counts | tojson }}
}
</script>

<script>
    const locationData = JSON.parse(
        document.getElementById("location-data").textContent
    );

    const locationCtx = document.getElementById("locationChart");

    new Chart(locationCtx, {
        type: "bar",
        data: {
            labels: locationData.locations,
            datasets: [{
                label: "Number of Rides",
                data: locationData.counts
            }]
        },
        options: {
            responsive: true,
            indexAxis: "y",
            scales: {
                x: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: "Number of Rides"
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: "Start Location"
                    }
                }
            }
        }
    });
</script>
<a href="/">← Back to Prediction</a>
</body>

</html>
